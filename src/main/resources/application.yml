spring:
  application:
    name: dwell

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dwell}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB # Default 1MB is too small for video evidence
      max-request-size: 50MB

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate} # Flyway owns the schema; Hibernate only validates it against the entities
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${SHOW_SQL:false}

server:
  tomcat:
    max-swallow-size: -1 # Read oversized uploads to the end so the client gets 413 instead of a dropped connection

jwt:
  secret: ${JWT_SECRET} # At least 32 bytes (32 ASCII chars) for HS256
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000} # ms (default 1 hour)
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:1209600000} # ms (default 14 days)

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

swagger:
  server-url: ${SWAGGER_SERVER_URL:http://localhost:8080}

dwell:
  sla-check:
    enabled: ${SLA_CHECK_ENABLED:true} # Periodic SLA check (manual run via admin API works either way)
    interval: ${SLA_CHECK_INTERVAL:PT5M} # Time between periodic runs (ISO-8601, e.g. PT30S, PT5M)
    initial-delay: PT1M # Wait after startup before the first run
  demo:
    time-shift-enabled: ${DEMO_TIME_SHIFT_ENABLED:false} # Turn on only on the demo server

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET}
