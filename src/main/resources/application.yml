spring:
  application:
    name: dwell

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dwell}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate} # Flyway owns the schema; Hibernate only validates it against the entities
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${SHOW_SQL:false}

jwt:
  secret: ${JWT_SECRET} # At least 32 bytes (32 ASCII chars) for HS256
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000} # ms (default 1 hour)

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

swagger:
  server-url: ${SWAGGER_SERVER_URL:http://localhost:8080}
