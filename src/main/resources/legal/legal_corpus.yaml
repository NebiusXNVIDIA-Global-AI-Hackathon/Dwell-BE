# ─────────────────────────────────────────────
# 1. NYC Housing Maintenance Code — 집주인 기본 의무
# ─────────────────────────────────────────────
- id: NYC-HMC-27-2005
  source: NYC Housing Maintenance Code
  citation: "NYC Admin. Code § 27-2005"
  title: Duties of owner
  url: https://www.nyc.gov/assets/buildings/pdf/HousingMaintenanceCode.pdf#page=15
  issue_types: [all]
  used_by: [notice, analysis, assistant]
  text_type: verbatim
  text: |
    a. The owner of a multiple dwelling shall keep the premises in good repair.
    b. The owner of a multiple dwelling, in addition to the duty imposed upon such owner by
    subdivision a of this section, shall be responsible for compliance with the requirements of
    this code, except insofar as responsibility for compliance is imposed upon the tenant alone.
    c. The owner of a one- or two-family dwelling shall keep the premises in good repair, and
    shall be responsible for compliance with the provisions of this code, except to the extent
    otherwise agreed between such owner and any tenant of such dwelling by lease or other
    contract in writing, or except insofar as responsibility for compliance with this code is
    imposed upon the tenant alone.
    d. The owner of a dwelling shall not harass any tenants or persons lawfully entitled to
    occupancy of such dwelling as set forth in paragraph 48 of subdivision a of section 27-2004.
  summary: >
    The owner must keep the building and apartments in good repair and is responsible for
    complying with the Housing Maintenance Code, except where the tenant alone is responsible.
    The owner must not harass tenants.

- id: NYC-HMC-27-2005-E
  source: NYC Housing Maintenance Code
  citation: "NYC Admin. Code § 27-2005(e)(1)"
  title: Notice before interrupting heat, hot water, water, gas or electricity
  url: https://www.nyc.gov/assets/buildings/pdf/HousingMaintenanceCode.pdf#page=15
  issue_types: [heat, hot_water, leak]
  used_by: [assistant, analysis]
  text_type: verbatim
  text: |
    The owner of a multiple dwelling shall provide lawful occupants of such multiple dwelling
    with notice prior to making repairs, or performing other work, that will cause an
    interruption of any heat, hot water, cold water, gas or electricity service expected to last
    for two or more hours. ... the notice shall be publicly posted in a prominent place within
    the multiple dwelling at least twenty-four hours before the interruption of such service is
    expected to commence and shall remain posted until such interruption ends. ... Such notice
    shall be posted in English, Spanish and such other languages as the department may
    provide by rule.
  summary: >
    Planned shutoffs of heat/hot water/water/gas/electricity lasting 2+ hours need a posted
    notice at least 24 hours in advance (emergencies excepted), in English and Spanish.

- id: NYC-HMC-27-2006
  source: NYC Housing Maintenance Code
  citation: "NYC Admin. Code § 27-2006"
  title: Duties of tenant
  url: https://www.nyc.gov/assets/buildings/pdf/HousingMaintenanceCode.pdf#page=16
  issue_types: [all]
  used_by: [assistant, analysis]
  text_type: verbatim
  text: |
    a. A tenant shall ... be responsible for violations of this code to the extent that he or
    she has the power to prevent the occurrence of a violation. A tenant has the power to
    prevent the occurrence of a violation if:
    (1) It is caused by his or her own wilful act or that of a member of his or her family or
    household, or a guest; or
    (2) It is the result of such tenant's gross negligence, neglect or abuse, or the gross
    negligence, neglect or abuse of a member of his or her family, or household or a guest.
    c. The fact that a tenant is or may be liable for a violation of this code or any other law or
    is found liable for civil or criminal penalties does not relieve the owner of his or her
    obligation to keep the premises, and every part thereof, in good repair.
  summary: >
    A tenant is responsible only for conditions caused by their own willful act or gross
    negligence (or household/guests). Even then, the owner still must keep the premises in
    good repair. Useful when a landlord replies "you caused it".

- id: NYC-HMC-27-2008
  source: NYC Housing Maintenance Code
  citation: "NYC Admin. Code § 27-2008"
  title: Owner's right of access
  url: https://www.nyc.gov/assets/buildings/pdf/HousingMaintenanceCode.pdf#page=17
  issue_types: [all]
  used_by: [assistant, verify]
  text_type: verbatim
  text: |
    No tenant shall refuse to permit the owner, or his or her agent or employee, to enter such
    tenant's dwelling unit or other space under his or her control to make repairs or
    improvements required by this code or other law or to inspect such apartment or other
    space to determine compliance with this code or any other provision of law, if the right of
    entry is exercised at a reasonable time and in a reasonable manner.
  summary: >
    The tenant must allow access for required repairs or inspections at a reasonable time and
    in a reasonable manner. Relevant when scheduling repair visits.

- id: NYC-HMC-27-2004-A48
  source: NYC Housing Maintenance Code
  citation: "NYC Admin. Code § 27-2004(a)(48)"
  title: Definition of harassment (selected)
  url: https://www.nyc.gov/assets/buildings/pdf/HousingMaintenanceCode.pdf#page=10
  issue_types: [all]
  used_by: [assistant, escalation, building]
  text_type: verbatim
  text: |
    48. ... the term "harassment" shall mean any act or omission by or on behalf of an owner
    that (i) causes or is intended to cause any person lawfully entitled to occupancy of a
    dwelling unit to vacate such dwelling unit or to surrender or waive any rights in relation to
    such occupancy, and (ii) includes one or more of the following acts or omissions ...:
    b. repeated interruptions or discontinuances of essential services, or an interruption or
    discontinuance of an essential service for an extended duration or of such significance as
    to substantially impair the habitability of such dwelling unit;
    b-2. repeated failures to correct hazardous or immediately hazardous violations of this
    code ... relating to the dwelling unit or the common areas of the building containing such
    dwelling unit, within the time required for such corrections;
    b-3. repeated false certifications that a violation of this code or the New York city
    construction codes, relating to the building containing such dwelling unit, has been
    corrected;
  summary: >
    Owner harassment can include repeated or prolonged loss of essential services (like heat),
    repeatedly failing to correct hazardous violations on time, and repeatedly filing false
    certifications that violations were corrected. Ties repeated "fixed but not fixed" patterns
    (F4) and building history (F5/F6) to a recognized legal concept.

# ─────────────────────────────────────────────
# 2. 누수 (leak)
# ─────────────────────────────────────────────
- id: NYC-HMC-27-2026
  source: NYC Housing Maintenance Code
  citation: "NYC Admin. Code § 27-2026"
  title: Maintenance of sewer connections and plumbing fixtures
  url: https://www.nyc.gov/assets/buildings/pdf/HousingMaintenanceCode.pdf#page=41
  issue_types: [leak]
  used_by: [notice, analysis, assistant]
  text_type: verbatim
  text: |
    The owner of a dwelling shall properly maintain and keep in good repair the plumbing and
    drainage system, including water closets, toilets, sinks and other fixtures.
  summary: The owner must maintain and repair plumbing, drainage, toilets, sinks and fixtures.

- id: NYC-HMC-27-2027-B
  source: NYC Housing Maintenance Code
  citation: "NYC Admin. Code § 27-2027(b)"
  title: Drainage of roofs (dampness in walls and ceilings)
  url: https://www.nyc.gov/assets/buildings/pdf/HousingMaintenanceCode.pdf#page=41
  issue_types: [leak]
  used_by: [notice, analysis]
  text_type: verbatim
  text: |
    b. The owner of a dwelling shall provide and maintain drainage from all roofs to carry off
    storm water, to prevent it from dripping to the ground, or from causing dampness in walls,
    ceilings, and open spaces.
  summary: >
    The owner must maintain roof drainage so storm water does not cause dampness in walls and
    ceilings. Relevant to ceiling leaks on top floors or after rain.

# ─────────────────────────────────────────────
# 3. 곰팡이 (mold) — Local Law 55 of 2018
# ─────────────────────────────────────────────
- id: NYC-HMC-27-2017-DEF
  source: NYC Housing Maintenance Code
  citation: "NYC Admin. Code § 27-2017"
  title: Definitions — indoor mold hazard, underlying defect, visible mold
  url: https://www.nyc.gov/assets/buildings/pdf/HousingMaintenanceCode.pdf#page=25
  issue_types: [mold, leak]
  used_by: [notice, analysis, verify]
  text_type: verbatim
  text: |
    Indoor mold hazard. The term "indoor mold hazard" means any condition of mold growth on an
    indoor surface, building structure or ventilation system, including mold that is within wall
    cavities, that is likely to cause harm to a person or that has been cited as a violation by
    the department.
    Underlying defect. The term "underlying defect" means a condition that causes an indoor
    mold hazard, such as a water leak or water infiltration from plumbing or defective masonry
    pointing or other moisture condition, or causes an infestation of pests, including holes or
    entryway paths for pests.
    Visible mold. The term "visible mold" means mold that is readily identifiable by visual
    inspection, including mold that is behind furniture or other interior obstructions.
  summary: >
    A water leak that causes mold is an "underlying defect". Mold inside wall cavities also
    counts as an indoor mold hazard.

- id: NYC-HMC-27-2017.1
  source: NYC Housing Maintenance Code
  citation: "NYC Admin. Code § 27-2017.1"
  title: Owners' responsibility to remediate (incl. underlying defect)
  url: https://www.nyc.gov/assets/buildings/pdf/HousingMaintenanceCode.pdf#page=26
  issue_types: [mold, leak]
  used_by: [notice, analysis, verify]
  text_type: verbatim
  text: |
    The existence of an indoor allergen hazard in any dwelling unit in a multiple dwelling is
    hereby declared to constitute a condition dangerous to health. An owner of a dwelling shall
    keep the premises free from pests and other indoor allergen hazards and from any condition
    conducive to indoor allergen hazards, and shall prevent the reasonably foreseeable
    occurrence of such a conditions and shall expeditiously remediate such conditions and any
    underlying defect, when such underlying defect exists, consistent with section 27-2017.8
    and the rules promulgated pursuant to section 27-2017.9.
  summary: >
    Mold is declared a condition dangerous to health. The owner must remediate it promptly AND
    fix the underlying defect (e.g., the leak). Core basis for F4 "Surface-only": painting over
    a stain without fixing the leak does not address the underlying defect.

- id: NYC-HMC-27-2017.2
  source: NYC Housing Maintenance Code
  citation: "NYC Admin. Code § 27-2017.2"
  title: Owners' responsibility to investigate (on complaint)
  url: https://www.nyc.gov/assets/buildings/pdf/HousingMaintenanceCode.pdf#page=26
  issue_types: [mold, leak]
  used_by: [notice, analysis]
  text_type: verbatim
  text: |
    a. The owner of a multiple dwelling shall cause an investigation to be made for indoor
    allergen hazards in all occupied dwelling units and in common areas ...
    b. Investigations shall be undertaken at least once a year and more often if necessary,
    such as when, in the exercise of reasonable care, an owner knows or should have known of
    a condition that is reasonably foreseeable to cause an indoor allergen hazard, or an
    occupant makes a complaint concerning a condition that is likely to cause an indoor
    allergen hazard or requests an inspection, or the department issues a notice of violation
    or orders the correction of a violation that is likely to cause an indoor allergen hazard.
  summary: >
    The owner must investigate at least yearly, and also when a tenant complains about a
    condition likely to cause mold (such as a leak) or requests an inspection.

- id: NYC-HMC-27-2017.3
  source: NYC Housing Maintenance Code
  citation: "NYC Admin. Code § 27-2017.3"
  title: Violation for visible mold (classes by area)
  url: https://www.nyc.gov/assets/buildings/pdf/HousingMaintenanceCode.pdf#page=26
  issue_types: [mold]
  used_by: [analysis, assistant, escalation]
  text_type: verbatim
  text: |
    a. The presence of visible mold in any room in a dwelling unit in a multiple dwelling shall
    constitute an indoor mold hazard violation as provided in this section, except when such
    mold is present on tile or grout:
    1. ... less than ten square feet in a room within a dwelling unit shall constitute a
    non-hazardous violation.
    2. ... between ten square feet and thirty square feet in a room within a dwelling unit
    shall constitute a hazardous violation.
    4. ... greater than or equal to thirty square feet in a room within a dwelling unit, shall
    constitute an immediately hazardous violation.
    c. 2. The date for correction of an immediately hazardous violation pursuant to subdivision
    a of this section shall be twenty-one days after service of the notice of violation.
  key_facts:
    class_A_non_hazardous: "< 10 sq ft per room"
    class_B_hazardous: "10–30 sq ft per room"
    class_C_immediately_hazardous: ">= 30 sq ft per room (correct within 21 days)"
    excluded: "mold on tile or grout"
    upgrade: "uncorrected or falsely certified violations can be upgraded A→B, B→C"
  summary: >
    Visible mold in an apartment is a violation (except on tile/grout). Under 10 sq ft = Class A,
    10–30 sq ft = Class B, 30+ sq ft = Class C (21 days to correct). Uncorrected or falsely
    certified mold violations can be upgraded.
  notes: >
    앱은 면적을 측정하지 않음(F1은 수치 예측 안 함). 등급 판정 대신 "HPD 점검 시 면적 기준으로
    등급이 정해진다"는 설명용으로만 사용.

# ─────────────────────────────────────────────
# 4. 난방·온수 (heat / hot water)
# ─────────────────────────────────────────────
- id: NYC-HMC-27-2028
  source: NYC Housing Maintenance Code
  citation: "NYC Admin. Code § 27-2028"
  title: Central heat required
  url: https://www.nyc.gov/assets/buildings/pdf/HousingMaintenanceCode.pdf#page=42
  issue_types: [heat]
  used_by: [notice, analysis]
  text_type: verbatim
  text: |
    Except as otherwise provided in this article, every multiple dwelling and every tenant-
    occupied one or two-family dwelling shall be provided with heat from a central heating
    system constructed in accordance with the provisions of the building code and the
    regulations of the department.
  summary: Multiple dwellings and tenant-occupied 1–2 family homes must be provided with heat.

- id: NYC-HMC-27-2029
  source: NYC Housing Maintenance Code
  citation: "NYC Admin. Code § 27-2029"
  title: Minimum temperature to be maintained
  url: https://www.nyc.gov/assets/buildings/pdf/HousingMaintenanceCode.pdf#page=42
  issue_types: [heat]
  used_by: [notice, analysis, assistant, escalation]
  text_type: verbatim
  text: |
    a. During the period from October first through May thirty-first, centrally-supplied heat,
    in any dwelling in which such heat is required to be provided, shall be furnished so as to
    maintain, in every portion of such dwelling used or occupied for living purposes:
    (1) between the hours of six a.m. and ten p.m., a temperature of at least sixty-eight
    degrees Fahrenheit whenever the outside temperature falls below fifty-five degrees; and
    (2) between the hours of ten p.m. and six a.m., a temperature of at least sixty-two
    degrees Fahrenheit.
  key_facts:
    heat_season: "Oct 1 – May 31"
    day: "6am–10pm: >= 68°F indoors when outside < 55°F"
    night: "10pm–6am: >= 62°F indoors (regardless of outside temperature)"
  summary: >
    Heat season is Oct 1–May 31. Daytime (6am–10pm) indoor temperature must be at least 68°F when
    it is below 55°F outside; overnight (10pm–6am) at least 62°F.

- id: NYC-HMC-27-2031
  source: NYC Housing Maintenance Code
  citation: "NYC Admin. Code § 27-2031"
  title: Supply of hot water
  url: https://www.nyc.gov/assets/buildings/pdf/HousingMaintenanceCode.pdf#page=48
  issue_types: [hot_water]
  used_by: [notice, analysis, assistant]
  text_type: verbatim
  text: |
    Except as otherwise provided in this article, every bath, shower, washbasin and sink in any
    dwelling unit in a multiple dwelling or tenant-occupied one-family or two-family dwelling
    shall be supplied at all times between the hours of six a.m. and midnight with hot water at
    a constant minimum temperature of one hundred twenty degrees Fahrenheit from a central
    source of supply ..., provided however that baths and showers equipped with
    balanced-pressure mixing valves, thermostatic mixing valves or combination pressure
    balancing/thermostatic valves may produce a discharge temperature less than one hundred
    twenty degrees Fahrenheit but in no event less than one hundred ten degrees Fahrenheit.
  key_facts:
    min_temp: "120°F (110°F allowed at showers/baths with mixing valves)"
    hours_per_code_text: "6am–midnight"
    hours_per_hpd_page: "365 days per year (HPD guidance)"
  summary: >
    Hot water must be supplied at a constant minimum of 120°F (110°F at showers with mixing
    valves). HPD guidance describes it as required 365 days per year.
  notes: >
    ⚠ 시간 표기 불일치: PDF 원문은 "6 a.m. ~ midnight", HPD 안내 페이지는 "365일 상시".
    사용자 응답에는 시간대를 단정하지 말고 120°F 기준 + 원문 링크로 안내.

# ─────────────────────────────────────────────
# 5. 위반 등급·시정 기한·수리 완료 인증 (F3 SLA 근거 / F4 핵심)
# ─────────────────────────────────────────────
- id: NYC-HMC-27-2115-C
  source: NYC Housing Maintenance Code
  citation: "NYC Admin. Code § 27-2115(c)"
  title: Correction dates for violations
  url: https://www.nyc.gov/assets/buildings/pdf/HousingMaintenanceCode.pdf#page=161
  issue_types: [all]
  used_by: [analysis, assistant, escalation]
  text_type: verbatim
  text: |
    (c) The said notice of violation shall also specify the date by which each violation shall
    be corrected. Such date shall be:
    (1) ninety days from the date of mailing of the notice in the case of non-hazardous
    violations;
    (2) thirty days from the date of mailing of the notice in the case of hazardous
    violations; and
    (3) twenty-four hours in the case of immediately hazardous violations ...
  summary: >
    After HPD issues a violation: non-hazardous (A) 90 days, hazardous (B) 30 days, immediately
    hazardous (C) 24 hours to correct. Special Class C periods exist (see HPD-VIOLATION-CLASSES).
  notes: >
    이 기한은 HPD 위반 발부 "이후" 시정 기한이지 집주인 응답 기한이 아님.
    앱의 SLA(24h/72h/7일)는 제품 정책값 — 혼동 금지 (PRD Decisions).

- id: NYC-HMC-27-2115-F
  source: NYC Housing Maintenance Code
  citation: "NYC Admin. Code § 27-2115(f)"
  title: Owner certification of correction (and when a violation is deemed corrected)
  url: https://www.nyc.gov/assets/buildings/pdf/HousingMaintenanceCode.pdf#page=162
  issue_types: [all]
  used_by: [verify, escalation, assistant]
  text_type: verbatim
  text: |
    (f) (1) ... Such certification shall be made in writing, under oath by the registered owner,
    a registered officer or director of a corporate owner or by the registered managing agent
    ... no later than fourteen days after the date set for correction in the case of
    non-hazardous and hazardous violations, and no later than five days after the date set for
    correction in the case of immediately hazardous violations, and shall include the date when
    each violation was corrected. ...
    (2) A copy of such certification shall then be mailed not more than twelve calendar days
    from the date of receipt of notification to any complainant by the department.
    (3) (i) Such violation shall be deemed corrected seventy days from the date of receipt of
    such certification by the department unless the department has determined by a
    reinspection made within such period that the violation still has not been corrected ...;
    a copy of such notice shall be sent to the complainant.
  key_facts:
    certification: "owner certifies correction under oath (no inspection required)"
    complainant_copy: "HPD mails a copy to the complainant within 12 days"
    deemed_corrected: "70 days after HPD receives certification, unless reinspection finds it uncorrected"
  summary: >
    An owner can clear a violation by certifying under oath that it was corrected. The
    complainant receives a copy. If HPD does not reinspect and find otherwise within 70 days,
    the violation is deemed corrected — i.e., closed on paper without verification.
  notes: >
    ⭐ F4 근거: "종결 ≠ 해결". 인증만으로 서류상 종결될 수 있으므로 세입자 측 전후 증거가 중요.
    → HPD-CERT-CHALLENGE(세입자 이의 제기)와 함께 제시.

- id: HPD-VIOLATION-CLASSES
  source: NYC HPD
  citation: "HPD, Clear Violations"
  title: Violation classes and correction periods
  url: https://www.nyc.gov/site/hpd/services-and-information/clear-violations.page
  issue_types: [all]
  used_by: [analysis, assistant, escalation]
  text_type: summary
  text: |
    Class A (non-hazardous): 90 days from date of service.
    Class B (hazardous): 30 days from date of service.
    Class C (immediately hazardous) — mold, mice/cockroaches, rats, lead-based paint, window
    guards: 21 days. Self-closing doors: 14 days. Heat and hot water: no time (immediately).
    All other Class C: 24 hours.
  key_facts:
    heat_hot_water: "Class C, correction immediately (no grace period)"
    mold_class_C: "21 days"
    other_class_C: "24 hours"
  summary: >
    Heat and hot water violations are Class C and must be corrected immediately. Class C mold has
    21 days; other Class C conditions 24 hours; Class B 30 days; Class A 90 days.

- id: HPD-CERT-CHALLENGE
  source: NYC HPD
  citation: "HPD, Clear Violations — certification of correction"
  title: Tenants can challenge an owner's certification of correction
  url: https://www.nyc.gov/site/hpd/services-and-information/clear-violations.page
  issue_types: [all]
  used_by: [verify, escalation, assistant]
  text_type: summary
  text: |
    HPD notifies tenants when it receives an owner's certification of correction. Tenants may
    challenge the certification, triggering an audit inspection (a reinspection by a Housing
    Inspector). Owners must certify only after conditions are corrected properly; HPD may audit
    any certification. A false certification subjects the owner to civil penalties and may
    result in placement on the Certification Watchlist. Violations found uncorrected after
    certification enter False Certification status and remain open.
    Mold and pest violations cannot be certified through eCertification.
  summary: >
    If the landlord tells HPD it was fixed but it was not, the tenant can challenge the
    certification and HPD will send an inspector. False certifications carry penalties.
  notes: >
    ⭐ F4 판정이 Surface-only / Not fixed / Inconclusive일 때의 "다음 대응" 근거.

