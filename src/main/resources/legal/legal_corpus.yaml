# 6. 뉴욕주 법 (summary — 원문은 url)
# ─────────────────────────────────────────────
- id: NYS-RPL-235-B
  source: New York Real Property Law
  citation: "N.Y. Real Prop. Law § 235-b"
  title: Warranty of habitability
  url: https://www.nysenate.gov/legislation/laws/RPP/235-B
  issue_types: [all]
  used_by: [notice, analysis, assistant]
  text_type: summary
  text: |
    1. In every written or oral residential lease, the landlord is deemed to warrant that the
    premises and all areas used in connection with them in common with other tenants are fit
    for human habitation and for the uses reasonably intended by the parties, and that the
    occupants shall not be subjected to any conditions which would be "dangerous, hazardous or
    detrimental to their life, health or safety." Conditions caused by the misconduct of the
    tenant or persons under the tenant's direction or control are not a breach.
    2. Any agreement by a tenant waiving or modifying these rights is "void as contrary to public
    policy."
    3. In determining damages for breach, the court need not require expert testimony.
  summary: >
    Every residential lease (written or oral) includes a warranty that the apartment is fit to
    live in and free of conditions dangerous to health or safety. Tenants cannot waive this.

- id: NYS-RPL-223-B
  source: New York Real Property Law
  citation: "N.Y. Real Prop. Law § 223-b"
  title: Retaliation by landlord against tenant
  url: https://www.nysenate.gov/legislation/laws/RPP/223-B
  issue_types: [all]
  used_by: [notice, analysis, assistant]
  text_type: summary
  text: |
    1. No landlord shall serve a notice to quit, commence an action to recover possession, or
    substantially alter the terms of the tenancy in retaliation for:
    (a) a good faith complaint, by or in behalf of the tenant, to a governmental authority or to
    the landlord or the landlord's agent about alleged violations of health or safety laws,
    habitability, or repair obligations;
    (b) actions taken in good faith to secure or enforce rights under the lease or housing laws;
    (c) the tenant's participation in a tenants' organization.
    2. Substantially altering the terms of tenancy includes refusing to renew a lease or offering
    a renewal with unreasonable terms such as an unreasonable rent increase.
    3–4. A tenant may sue for damages and attorney's fees, and may raise retaliation as a
    defense in an eviction case.
    5. A rebuttable presumption of retaliation arises if the landlord takes such an action within
    one year after the tenant's protected complaint or action; the landlord must then prove a
    non-retaliatory reason.
    5-a. Lease provisions charging fees for filing a good-faith complaint are void.
    6. Does not apply to owner-occupied dwellings with fewer than four units, or where the
    tenant/household/guest caused the condition.
  key_facts:
    presumption_window: "1 year after the complaint"
    covers_non_renewal: true
    exception: "owner-occupied buildings with < 4 units"
  summary: >
    A landlord may not evict, refuse to renew, or impose unreasonable new terms because a tenant
    made a good-faith repair complaint to the landlord or to the City. Actions within one year
    of the complaint are presumed retaliatory. Does not apply to owner-occupied buildings with
    fewer than 4 units.
  notes: >
    PRD: 첫 Notice 생성 화면에 배치. 데모 페르소나의 "갱신 거절이 두려움"에 직접 대응.
    ⚠ 소유자 거주 4세대 미만 예외 → 온보딩에서 건물 규모 확인 필요할 수 있음.

- id: NYS-MDL-78
  source: New York Multiple Dwelling Law
  citation: "N.Y. Mult. Dwell. Law § 78"
  title: Repairs
  url: https://www.nysenate.gov/legislation/laws/MDW/78
  issue_types: [all]
  used_by: [notice, analysis]
  text_type: summary
  text: |
    1. Every multiple dwelling, including its roof or roofs, and every part thereof and the lot
    upon which it is situated, shall be kept in good repair. The owner shall be responsible for
    compliance; a tenant is also liable for violations caused by the tenant's own wilful act,
    assistance or negligence or that of a household member or guest.
    2. The department may order the repair or improvement of any condition dangerous to life or
    health.
  summary: >
    State law also requires owners of multiple dwellings (3+ units) to keep the building,
    including the roof, in good repair.

# ─────────────────────────────────────────────
# 7. 신고 경로·다음 단계 (F3 Escalated / Recommended Next Steps)
# ─────────────────────────────────────────────
- id: HPD-COMPLAINT-PROCESS
  source: NYC HPD
  citation: "HPD, Report a Quality or Safety Issue"
  title: How to file a complaint and what happens next
  url: https://www.nyc.gov/site/hpd/services-and-information/report-a-maintenance-issue.page
  issue_types: [all]
  used_by: [escalation, assistant, verify]
  text_type: summary
  text: |
    1. Contact your landlord first. If the landlord does not respond, file a complaint with 311.
    2. File: call 311 (TTY 212-504-4115), 311ONLINE, or the 311MOBILE app. You receive a Service
       Request number to track status on 311ONLINE or HPDONLINE.
    3. HPD contacts the managing agent, then tries to call the tenant back. If the tenant says
       the problem is fixed, HPD closes the complaint.
    4. If not fixed or HPD cannot reach the tenant, an inspector is sent; the owner is not told
       the inspection date.
    5. If English is not your primary language, tell the inspector, who can call a translator.
       HPD's "What to Expect" guide is available in English, Spanish, Traditional Chinese and
       Korean.
    6. If the owner certifies a fix, you get a notice by mail. If a reinspection finds the
       condition still exists, the violation stays open.
  key_facts:
    phone: "311 / TTY 212-504-4115"
    online: "https://portal.311.nyc.gov"
    hpdonline: "https://hpdonline.nyc.gov"
    caution: "Saying 'fixed' on HPD's callback closes the complaint"
  summary: >
    Notify the landlord first; if no response, file with 311 (phone, online, app). Only confirm
    "fixed" on HPD's callback if the problem is really resolved — otherwise the complaint closes.
  notes: >
    ⭐ HPD 콜백에서 "고쳐졌다"고 답하면 민원 종결 → F4 검증 전 섣불리 답하지 않도록 안내.
    311·HPDONLINE URL은 페이지 표기(구 www1 주소) 대신 현행 주소로 적음 — 배포 전 링크 재확인.

- id: HPD-EMERGENCY-REPAIR
  source: NYC HPD
  citation: "HPD, Heat and Hot Water / Emergency Repair Program"
  title: Emergency Repair Program
  url: https://www.nyc.gov/site/hpd/services-and-information/heat-and-hot-water-information.page
  issue_types: [heat, hot_water, leak]
  used_by: [escalation, assistant]
  text_type: summary
  text: |
    For immediately hazardous conditions (including no heat or hot water), if the owner does not
    correct the condition after a violation is issued, HPD's Emergency Repair Program may
    contract with private companies to make the repair and bill the owner. Status of HPD
    emergency repair work in progress: 212-863-5510 (status only).
  summary: >
    If the landlord does not fix an immediately hazardous condition after HPD issues a
    violation, HPD may make the repair itself and bill the owner.

- id: HPD-HEAT-GUIDE
  source: NYC HPD
  citation: "HPD, Heat and Hot Water Information"
  title: Heat and hot water — tenant guidance
  url: https://www.nyc.gov/site/hpd/services-and-information/heat-and-hot-water-information.page
  issue_types: [heat, hot_water]
  used_by: [assistant, analysis]
  text_type: summary
  text: |
    Heat season: October 1 – May 31. 6am–10pm: at least 68°F inside when outside is below 55°F.
    10pm–6am: at least 62°F inside regardless of outside temperature. Hot water: 365 days per
    year at a constant minimum of 120°F. Contact the landlord first; if not resolved, file a
    complaint with 311. Complaints may be filed anonymously (an inspector then picks an
    apartment at random).
  summary: >
    Plain-language version of the heat/hot water rules plus the 311 path. Anonymous complaints
    are possible — relevant for tenants afraid of retaliation.

- id: HPD-LL55-MOLD-GUIDE
  source: NYC HPD
  citation: "HPD, Indoor Allergen Hazards (Mold and Pests)"
  title: Mold — tenant guidance (Local Law 55)
  url: https://www.nyc.gov/site/hpd/services-and-information/indoor-allergen-hazards-mold-and-pests.page
  issue_types: [mold, leak]
  used_by: [assistant, analysis, verify]
  text_type: summary
  text: |
    Local Law 55 of 2018 applies to buildings with three or more units: owners must keep
    apartments free of mold and pests, inspect units annually, and fix underlying causes such as
    leaks. In buildings with 10 or more units, mold over 10 square feet must be handled by a New
    York State Department of Labor–licensed mold assessor and a separate licensed remediator.
    Tenants: if you observe a leak, signs of mold, or pests, notify your landlord; if the
    landlord does not act or the work is not done safely, file a complaint online or call 311.
    If you or your child has asthma, your doctor can request a free home environmental
    inspection through the NYC Health Department's Online Registry.
  key_facts:
    applies_to: "buildings with 3+ units"
    licensed_contractor: "10+ units and mold > 10 sq ft"
  summary: >
    Mold law covers 3+ unit buildings. Owners must fix the leak causing mold, and large mold jobs
    in 10+ unit buildings require licensed, independent assessor and remediator.
  notes: >
    F4: 큰 곰팡이 수리를 면허 업체 없이 "칠만 하고" 끝냈다면 Surface-only 판정 근거 보강 가능.

- id: NYC-HOUSING-COURT
  source: NY Courts / NYC HPD
  citation: "NYC Housing Court — starting an HP proceeding"
  title: Housing Court (HP proceeding) for repairs
  url: http://www.courts.state.ny.us/courts/nyc/housing/startinghp.shtml
  issue_types: [all]
  used_by: [escalation, assistant]
  text_type: summary
  text: |
    If a violation remains open, a tenant may take legal action against the landlord in Housing
    Court to get repairs made. Tenants may seek free legal counsel if they qualify, or ask a
    representative in any Housing Court for help filing a case.
  summary: >
    If repairs are still not made, a tenant can start a repair case (HP proceeding) in Housing
    Court; free legal help may be available.
  notes: 링크는 HPD 페이지에 실린 주소 그대로 — 배포 전 접속 확인 필요.
