# Test-only config - the DB comes from a Testcontainers PostgreSQL container (see TestcontainersConfig)
spring:
  flyway:
    enabled: true # Run the same migrations as production
  jpa:
    hibernate:
      ddl-auto: validate # Fail the test if entities and migrations drift apart
    open-in-view: false

jwt:
  secret: test-secret-key-must-be-at-least-32-bytes-long
  access-token-expiration: 3600000

cors:
  allowed-origins: http://localhost:3000

aws:
  region: ap-northeast-2
  s3:
    bucket: test-bucket
